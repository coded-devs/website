# Opt-in replacement for the standalone Coolify resources. Do not deploy until the cutover checklist is complete.
# Build context is the repository root; use this file from Coolify's Docker Compose deployment.
services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      SITE_URL: https://codeddevs.org
      API_URL: http://api:4000
      CONTENT_REVALIDATION_SECRET: ${CONTENT_REVALIDATION_SECRET:?Set a secret in Coolify}
    networks:
      - proxy
      - frontend
    labels:
      - traefik.docker.network=codweb-frontend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3001'
      API_INTERNAL_ORIGIN: http://api:4000
    networks:
      - proxy
      - frontend
    labels:
      - traefik.docker.network=codweb-frontend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: ${DATABASE_URL:?Set the URL pointing to postgres:5432; URL-encode password}
      ADMIN_ORIGIN: https://admin.codeddevs.org
      WEB_INTERNAL_ORIGIN: https://codeddevs.org
      API_TRUST_PROXY_HOPS: '1'
      AUTH_THROTTLE_HMAC_SECRET: ${AUTH_THROTTLE_HMAC_SECRET:?Set a secret in Coolify}
      CONTENT_REVALIDATION_SECRET: ${CONTENT_REVALIDATION_SECRET:?Set a secret in Coolify}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set account ID in Coolify}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set access key in Coolify}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set secret key in Coolify}
      R2_BUCKET: ${R2_BUCKET:-codweb-media}
      R2_PUBLIC_BASE_URL: https://media.codeddevs.org
    networks:
      - frontend
      - database
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:4000/api/v1/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeddevs}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # Existing Coolify destination. Traefik already joins this Docker network.
  proxy:
    name: codweb-frontend
    external: true
  # Private service-to-service network. Not connected to the reverse proxy.
  frontend:
    driver: bridge
  # No external gateway; only the API and PostgreSQL join.
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
