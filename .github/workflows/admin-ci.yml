name: Admin CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  admin-checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codeddevs/admin lint
      - run: pnpm --filter @codeddevs/admin typecheck
      - run: pnpm --filter @codeddevs/admin test
      - run: pnpm --filter @codeddevs/admin build
